name: Supabase keep-alive

# Free-tier Supabase projects pause after ~7 days without database activity.
# This runs a real one-row SELECT against the database via the REST API every day.
# It talks to Supabase directly so it keeps working even if the Vercel site is down.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_URL       e.g. https://cqexpcfmiyygkeoeddre.supabase.co
#   SUPABASE_ANON_KEY  the project's anon / publishable key

on:
  schedule:
    # 14:00 UTC = 7:00 AM PDT / 6:00 AM PST
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase (one-row select)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_ANON_KEY repository secrets must be set."
            exit 1
          fi

          status=$(curl --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 30 \
            --output response.json --write-out '%{http_code}' \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Accept: application/json" \
            "${SUPABASE_URL%/}/rest/v1/lessons?select=id&limit=1")

          echo "HTTP ${status}"
          cat response.json; echo

          if [ "$status" != "200" ]; then
            echo "::error::Supabase keep-alive query failed with HTTP ${status}. The project may be paused — restore it from the Supabase dashboard."
            exit 1
          fi
